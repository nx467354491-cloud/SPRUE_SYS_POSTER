<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sprue Maker V3 | Poster Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Michroma&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --sprue-color: #f4f4f4;
            --sprue-thick: 6px; 
            --highlight-color: #cc2f7b;
        }
        body { 
            font-family: 'Space Mono', monospace; 
            background-color: var(--bg-color); 
            color: var(--sprue-color); 
            overflow: hidden;
            user-select: none;
        }

        /* Initial Screen Animations */
        .blink-text {
            animation: blink 2s linear infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .glitch-flicker {
            animation: flicker-opacity 3s infinite;
        }
        @keyframes flicker-opacity {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.2; }
            21%, 63.5%, 68% { opacity: 0.6; }
        }

        .yes-btn {
            margin-top: 32px;
            padding: 10px 48px;
            border: 2px solid var(--highlight-color);
            color: var(--highlight-color);
            background: transparent;
            font-family: 'Michroma', sans-serif;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            outline: none;
        }
        .yes-btn:hover {
            background-color: var(--highlight-color);
            color: #fff;
            box-shadow: 0 0 20px rgba(204, 47, 123, 0.6);
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .canvas-wrapper { 
            background-color: var(--bg-color);
            height: calc(100vh - 160px); 
            position: relative;
            display: block;
        }

        .ui-sprue-box {
            background: var(--bg-color);
            border: var(--sprue-thick) solid var(--sprue-color);
            border-radius: 20px;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ui-main-runner {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: var(--sprue-thick);
            background-color: var(--sprue-color);
            transform: translateY(-50%);
            z-index: 1;
        }

        .prop-item {
            min-width: 60px;
            height: 60px;
            border: 3px solid var(--sprue-color);
            border-radius: 12px;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: 'Michroma', sans-serif;
            cursor: grab;
            position: relative;
            flex-shrink: 0;
        }
        .prop-item:active { cursor: grabbing; border-color: #888; color: #888; }
        
        .prop-item::before, .prop-item::after {
            content: ''; position: absolute; width: 3px; height: 10px; background: var(--sprue-color);
            left: 50%; transform: translateX(-50%); z-index: -1;
        }
        .prop-item::before { top: -12px; }
        .prop-item::after { bottom: -12px; }

        .prop-item svg { height: 32px; width: auto; pointer-events: none; }
        .prop-item svg path, .prop-item svg rect, .prop-item svg polygon, .prop-item svg circle, .prop-item svg g {
            fill: var(--sprue-color) !important;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #555; border-radius: 2px; }

        #assetsBox {
            transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }
        #assetsBox.is-expanded {
            height: 50vh;
            min-height: 350px;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.95);
            z-index: 100;
        }
        
        #propsTray { transition: all 0.2s ease; }
        #propsTray.is-expanded {
            flex-wrap: wrap;
            overflow-y: auto;
            overflow-x: hidden;
            align-content: flex-start;
            padding-bottom: 24px;
        }
        
        #propsTray.is-expanded::-webkit-scrollbar {
            display: block;
            width: 8px;
        }
        #propsTray.is-expanded::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 4px;
        }
        #propsTray.is-expanded::-webkit-scrollbar-track {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
    </style>
</head>

    <div class="noise-overlay"></div>

        <h1 class="text-4xl font-['Michroma'] tracking-[0.2em] mb-2 text-white shadow-[0_0_10px_#fff]">SPRUE_SYS.V3</h1>
        <p class="text-sm tracking-widest text-gray-400 blink-text">> 是否通过生物验证？ / BIOMETRIC VERIFICATION REQUIRED? <</p>
        <button id="verify-yes-btn" class="yes-btn">YES</button>
    </div>

    <!-- SPRUE_SYS 主工作台界面 -->
    <header class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-20 mix-blend-difference">
        <div class="space-y-1">
            <h1 class="text-3xl font-bold font-['Michroma'] uppercase tracking-tighter">SPRUE_SYS.V3</h1>
            <p class="text-[10px] tracking-widest opacity-70">STEALTH TRANSPORT OF IMMUNOGENIC PAYLOADS</p>
            <p class="text-[10px] tracking-widest opacity-70">[ MODULE ALIGNMENT: ACTIVE ]</p>
        </div>
        <div class="text-right space-y-1">
            <div class="text-xl tracking-[0.2em] font-bold">|||||| || ||| ||</div>
            <p class="text-[10px] tracking-widest opacity-70">HANDLE UNDER BIOSAFE CONDITIONS</p>
            <div class="flex justify-end gap-2 mt-2">
                <span class="border border-white px-2 py-0.5 text-[10px]">US</span>
                <span class="border border-white px-2 py-0.5 text-[10px]">RX2</span>
            </div>
        </div>
    </header>

    <main class="canvas-wrapper w-full overflow-hidden relative" id="mainContainer">
        <canvas id="modelCanvas"></canvas>
    </main>

    <footer class="h-[160px] w-full bg-[#000000] relative px-6 flex items-center gap-6 border-t border-gray-900 shadow-[0_-10px_30px_rgba(0,0,0,0.8)] z-30">
        <div class="ui-main-runner"></div>

        <div class="relative flex-1 h-[110px] min-w-0 z-40">
            <div id="assetsBox" class="ui-sprue-box w-full !absolute bottom-0 left-0 h-[110px] p-4 flex flex-col justify-start gap-2 min-w-0">
                <div class="w-full flex justify-between items-center text-[10px] text-gray-400 px-1 uppercase mb-1 shrink-0">
                    <span class="flex items-center">
                        [ ASSETS.DIR ] <span class="text-white ml-2 mr-3">机密档案</span>
                        
                        <button id="expandTrayBtn" title="Expand Models" class="text-red-500 hover:text-red-400 transition-colors outline-none cursor-pointer p-1 rounded hover:bg-white/10 flex items-center justify-center">
                            <svg id="expandTrayIcon" class="w-4 h-4 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 15l-6-6-6 6"/>
                            </svg>
                        </button>
                    </span>
                    
                    <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 text-white px-2 py-1 rounded transition-colors flex items-center gap-1 font-bold">
                        + IMPORT SVG
                        <input type="file" id="svgUpload" accept=".svg" multiple class="hidden">
                    </label>
                </div>
                
                <div class="w-full flex gap-6 overflow-x-auto hide-scrollbar items-center px-2 py-2" id="propsTray">
                    <!-- SVG items will be injected here via JS -->
                </div>
            </div>
        </div>

        <div class="ui-sprue-box w-[240px] h-[110px] p-4 flex flex-col justify-center gap-2 shrink-0">
            <div class="w-full flex justify-between text-[10px] text-gray-400 px-1 uppercase mb-1">
                <span>Drag or Click >>></span>
                <span class="text-white">文字</span>
            </div>
            <div class="flex items-center gap-2 w-full">
                <input type="text" id="customText" placeholder="TYPE..." class="bg-[#111] border border-gray-700 text-white min-w-0 flex-1 text-xs px-2 py-1.5 outline-none font-['Michroma'] uppercase rounded text-center">
                <button id="addCustomTextBtn" class="bg-white text-black text-[10px] font-bold px-3 py-1.5 rounded hover:bg-gray-300 transition-colors shrink-0">ADD</button>
            </div>
        </div>

        <div class="ui-sprue-box w-[300px] h-[110px] p-3 flex flex-col justify-center shrink-0">
            <label id="uploadView" for="imageUpload" class="flex flex-col items-center justify-center w-full h-full border-2 border-dashed border-gray-600 rounded-xl cursor-pointer hover:border-white transition-all bg-[#0a0a0a]">
                <span class="text-xs tracking-widest">[ SYS.UPLOAD_IMG ]</span>
                <input id="imageUpload" type="file" class="hidden" accept="image/*" />
            </label>
            <div id="settingsView" class="hidden w-full h-full flex flex-col justify-between">
                <div class="flex justify-between items-center text-[10px]">
                    <span class="text-gray-400">THRESHOLD</span>
                    <span id="thresholdValDisplay" class="text-white bg-gray-800 px-1 rounded">128</span>
                </div>
                <input type="range" id="thresholdSlider" min="1" max="255" value="128" class="my-2">
                <div class="flex gap-2">
                    <button id="cancelImgBtn" class="flex-1 bg-gray-800 text-white text-[10px] py-1 rounded hover:bg-gray-700">CANCEL</button>
                    <button id="insertImgBtn" class="flex-1 bg-white text-black font-bold text-[10px] py-1 rounded hover:bg-gray-200">INSERT IMAGE</button>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-3 z-10 w-[180px] shrink-0">
            <button id="generateRunnersBtn" class="ui-sprue-box h-[48px] w-full text-sm font-bold hover:bg-white hover:text-black transition-colors uppercase tracking-wider cursor-pointer active:scale-95">
                GENERATE_FRAME
            </button>
            <button id="downloadBtn" class="ui-sprue-box h-[48px] w-full text-sm font-bold text-gray-400 border-gray-600 hover:border-white hover:text-white transition-colors uppercase tracking-wider cursor-pointer active:scale-95">
                EXPORT_SAVE
            </button>
        </div>

    <script>
        // 处理初始画面的进入主逻辑
        const initScreen = document.getElementById('init-screen');
        const verifyYesBtn = document.getElementById('verify-yes-btn');

        verifyYesBtn.addEventListener('click', () => {
            initScreen.style.opacity = '0';
            setTimeout(() => {
                initScreen.style.display = 'none';
            }, 500);
        });

        // 以下为主应用逻辑配置
        const CONFIG = {
            bgColor: '#000000',
            lineColor: '#f4f4f4', 
            lineWidth: 10,
            fontFamily: 'Michroma, sans-serif',
            padding: 24, 
            gridSize: 20 
        };

        const mainContainer = document.getElementById('mainContainer');

        const canvas = new fabric.Canvas('modelCanvas', {
            width: mainContainer.clientWidth,
            height: mainContainer.clientHeight,
            backgroundColor: '#000000',
            preserveObjectStacking: true, 
            selection: false 
        });
        const ctx = canvas.getContext();

        window.addEventListener('resize', () => {
            canvas.setWidth(mainContainer.clientWidth);
            canvas.setHeight(mainContainer.clientHeight);
            canvas.renderAll();
        });

        canvas.on('mouse:wheel', function(opt) {
            var delta = opt.e.deltaY;
            var zoom = canvas.getZoom();
            zoom *= 0.999 ** delta;
            if (zoom > 5) zoom = 5;
            if (zoom < 0.2) zoom = 0.2;
            canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
            opt.e.preventDefault();
            opt.e.stopPropagation();
        });

        let isDraggingViewport = false;
        let lastPosX, lastPosY;

        canvas.on('mouse:down', function(opt) {
            var evt = opt.e;
            if (!opt.target) {
                isDraggingViewport = true;
                lastPosX = evt.clientX;
                lastPosY = evt.clientY;
            }
        });

        canvas.on('mouse:move', function(opt) {
            if (isDraggingViewport) {
                var e = opt.e;
                var vpt = canvas.viewportTransform;
                vpt[4] += e.clientX - lastPosX;
                vpt[5] += e.clientY - lastPosY;
                canvas.requestRenderAll();
                lastPosX = e.clientX;
                lastPosY = e.clientY;
            }
        });

        const expandTrayBtn = document.getElementById('expandTrayBtn');
        const assetsBox = document.getElementById('assetsBox');
        const propsTray = document.getElementById('propsTray');
        const expandTrayIcon = document.getElementById('expandTrayIcon');

        expandTrayBtn.addEventListener('click', () => {
            const isExpanded = assetsBox.classList.contains('is-expanded');
            if (isExpanded) {
                assetsBox.classList.remove('is-expanded');
                propsTray.classList.remove('is-expanded');
                expandTrayIcon.style.transform = 'rotate(0deg)';
            } else {
                assetsBox.classList.add('is-expanded');
                propsTray.classList.add('is-expanded');
                expandTrayIcon.style.transform = 'rotate(180deg)';
            }
        });

        let globalRunners = []; 
        let isFrameGenerated = false; 

        let activeAlignLines = { vertical: [], horizontal: [] };
        const aligningLineColor = '#ff0000'; 
        const aligningLineWidth = 1; 
        const aligningLineMargin = 10;

        canvas.on('object:moving', function(e) {
            const activeObj = e.target;
            const objects = canvas.getObjects().filter(obj => obj !== activeObj && obj.isSpruePart);
            activeAlignLines = { vertical: [], horizontal: [] };

            let actW = activeObj.width * (activeObj.scaleX || 1);
            let actH = activeObj.height * (activeObj.scaleY || 1);
            let actEdgesX = { left: activeObj.left - actW/2, right: activeObj.left + actW/2 };
            let actEdgesY = { top: activeObj.top - actH/2, bottom: activeObj.top + actH/2 };

            let minDx = aligningLineMargin, minDy = aligningLineMargin;
            let newLeft = activeObj.left, newTop = activeObj.top;
            let snappedX = false, snappedY = false;

            objects.forEach(target => {
                const tgtW = target.width * target.scaleX;
                const tgtH = target.height * target.scaleY;
                const tgtEdgesX = { left: target.left - tgtW/2, right: target.left + tgtW/2 };
                const tgtEdgesY = { top: target.top - tgtH/2, bottom: target.top + tgtH/2 };

                for (let actKey in actEdgesX) {
                    for (let tgtKey in tgtEdgesX) {
                        let dx = Math.abs(actEdgesX[actKey] - tgtEdgesX[tgtKey]);
                        if (dx < minDx) {
                            minDx = dx;
                            newLeft = tgtEdgesX[tgtKey] + (actKey === 'left' ? actW/2 : -actW/2);
                            snappedX = true;
                            activeAlignLines.vertical = [{
                                x: tgtEdgesX[tgtKey],
                                y1: Math.min(activeObj.top, target.top) - (actH+tgtH),
                                y2: Math.max(activeObj.top, target.top) + (actH+tgtH)
                            }];
                        }
                    }
                }

                for (let actKey in actEdgesY) {
                    for (let tgtKey in tgtEdgesY) {
                        let dy = Math.abs(actEdgesY[actKey] - tgtEdgesY[tgtKey]);
                        if (dy < minDy) {
                            minDy = dy;
                            newTop = tgtEdgesY[tgtKey] + (actKey === 'top' ? actH/2 : -actH/2);
                            snappedY = true;
                            activeAlignLines.horizontal = [{
                                y: tgtEdgesY[tgtKey],
                                x1: Math.min(activeObj.left, target.left) - (actW+tgtW),
                                x2: Math.max(activeObj.left, target.left) + (actW+tgtW)
                            }];
                        }
                    }
                }
            });

            if (!snappedX) newLeft = Math.round(activeObj.left / CONFIG.gridSize) * CONFIG.gridSize;
            if (!snappedY) newTop = Math.round(activeObj.top / CONFIG.gridSize) * CONFIG.gridSize;
            
            activeObj.set({ left: newLeft, top: newTop });
        });

        canvas.on('after:render', function() {
            if (activeAlignLines.vertical.length > 0 || activeAlignLines.horizontal.length > 0) {
                ctx.save();
                const vpt = canvas.viewportTransform;
                ctx.transform(vpt[0], vpt[1], vpt[2], vpt[3], vpt[4], vpt[5]);
                
                ctx.lineWidth = aligningLineWidth / canvas.getZoom();
                ctx.strokeStyle = aligningLineColor;
                ctx.setLineDash([4 / canvas.getZoom(), 4 / canvas.getZoom()]); 
                
                ctx.beginPath();
                activeAlignLines.vertical.forEach(line => {
                    ctx.moveTo(line.x, line.y1); ctx.lineTo(line.x, line.y2);
                });
                activeAlignLines.horizontal.forEach(line => {
                    ctx.moveTo(line.x1, line.y); ctx.lineTo(line.x2, line.y);
                });
                ctx.stroke();
                ctx.restore();
            }
        });

        canvas.on('mouse:up', function() {
            if (isDraggingViewport) {
                canvas.setViewportTransform(canvas.viewportTransform);
                isDraggingViewport = false;
            }
            activeAlignLines = { vertical: [], horizontal: [] };
            canvas.renderAll();
        });

        const SVG_ASSETS = {};

        function initPreloadedSVGs() {
            const container = document.getElementById('svg-templates');
            const tray = document.getElementById('propsTray');
            tray.innerHTML = ''; 
            
            Array.from(container.children).forEach(div => {
                const key = div.getAttribute('data-id');
                const size = parseFloat(div.getAttribute('data-size'));
                const svgContent = div.innerHTML.trim();
                
                SVG_ASSETS[key] = { size: size, svg: svgContent };
                
                const propItem = document.createElement('div');
                propItem.className = 'prop-item';
                propItem.draggable = true;
                propItem.setAttribute('data-svg-key', key);
                propItem.innerHTML = svgContent;
                
                propItem.addEventListener('click', () => insertSVGProp(key));
                propItem.addEventListener('dragstart', (ev) => ev.dataTransfer.setData('svg-key', key));
                
                tray.appendChild(propItem);
            });
        }
        
        window.addEventListener('DOMContentLoaded', initPreloadedSVGs);

        document.getElementById('svgUpload').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;
            const tray = document.getElementById('propsTray');

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const rawSVG = event.target.result;
                    const key = 'custom_' + Date.now() + Math.random().toString(36).substr(2, 5);
                    SVG_ASSETS[key] = { size: 1.0 + Math.random() * 0.6, svg: rawSVG }; 
                    
                    const div = document.createElement('div');
                    div.className = 'prop-item';
                    div.draggable = true;
                    div.setAttribute('data-svg-key', key);
                    div.innerHTML = rawSVG; 
                    div.addEventListener('click', () => insertSVGProp(key));
                    div.addEventListener('dragstart', (ev) => ev.dataTransfer.setData('svg-key', key));
                    tray.appendChild(div);
                };
                reader.readAsText(file);
            });
            e.target.value = ''; 
        });

        function createSpruePart(innerElement, dropX = null, dropY = null) {
            const innerWidth = innerElement.width * (innerElement.scaleX || 1);
            const innerHeight = innerElement.height * (innerElement.scaleY || 1);

            const targetSizeMultipler = CONFIG.gridSize * 2;
            let frameWidth = Math.ceil((innerWidth + CONFIG.padding * 2) / targetSizeMultipler) * targetSizeMultipler;
            let frameHeight = Math.ceil((innerHeight + CONFIG.padding * 2) / targetSizeMultipler) * targetSizeMultipler;

            innerElement.set({ originX: 'center', originY: 'center', left: 0, top: 0 });

            if (dropX === null || dropY === null) {
                const center = canvas.getVpCenter();
                dropX = center.x;
                dropY = center.y;
            }

            dropX = Math.round(dropX / CONFIG.gridSize) * CONFIG.gridSize;
            dropY = Math.round(dropY / CONFIG.gridSize) * CONFIG.gridSize;

            const frame = new fabric.Rect({
                width: frameWidth, height: frameHeight,
                fill: CONFIG.bgColor, 
                stroke: CONFIG.lineColor, strokeWidth: CONFIG.lineWidth,
                rx: 16, ry: 16, 
                originX: 'center', originY: 'center', left: 0, top: 0,
                strokeUniform: true 
            });

            const lineOpts = { stroke: CONFIG.lineColor, strokeWidth: CONFIG.lineWidth, strokeUniform: true, originX: 'center', originY: 'center' };
            const gapX = innerWidth / 2 + 4;
            const gapY = innerHeight / 2 + 4;
            
            const topL = new fabric.Line([0, -frameHeight/2, 0, -gapY], lineOpts);
            const botL = new fabric.Line([0, gapY, 0, frameHeight/2], lineOpts);
            const leftL = new fabric.Line([-frameWidth/2, 0, -gapX, 0], lineOpts);
            const rightL = new fabric.Line([gapX, 0, frameWidth/2, 0], lineOpts);

            const group = new fabric.Group([frame, topL, botL, leftL, rightL, innerElement], {
                left: dropX,
                top: dropY,
                originX: 'center', originY: 'center',
                transparentCorners: false, cornerColor: '#ffffff', cornerStrokeColor: '#000000', borderColor: '#666666', cornerSize: 12,
                hasControls: true, isSpruePart: true,
                snapAngle: 45 
            });

            group.setControlsVisibility({ mt: false, mb: false, ml: false, mr: false });
            canvas.add(group);
            canvas.setActiveObject(group);
            clearGlobalRunners(); 
        }

        function insertSVGProp(key, dropX = null, dropY = null) {
            const asset = SVG_ASSETS[key];
            if (!asset) return;

            fabric.loadSVGFromString(asset.svg, function(objects, options) {
                objects.forEach(obj => {
                    if (obj.fill && obj.fill !== 'none' && obj.fill !== 'transparent') {
                        obj.set('fill', CONFIG.lineColor);
                    } else if (!obj.fill) {
                        obj.set('fill', CONFIG.lineColor); 
                    }
                    if (obj.stroke && obj.stroke !== 'none' && obj.stroke !== 'transparent') {
                        obj.set('stroke', CONFIG.lineColor);
                    }
                });
                
                const group = fabric.util.groupSVGElements(objects, options);
                
                const baseScale = 80 / Math.max(group.width, group.height);
                const finalScale = baseScale * asset.size; 
                
                group.set({
                    originX: 'center', originY: 'center',
                    scaleX: finalScale, scaleY: finalScale
                });

                createSpruePart(group, dropX, dropY);
            });
        }

        canvas.on('object:scaling', clearGlobalRunners);
        canvas.on('object:rotating', clearGlobalRunners);

        function clearGlobalRunners() {
            globalRunners.forEach(r => canvas.remove(r));
            globalRunners = [];
            
            isFrameGenerated = false;
            const btn = document.getElementById('generateRunnersBtn');
            if (btn) {
                btn.classList.remove('bg-white', 'text-black');
                btn.classList.add('text-white');
                btn.textContent = 'GENERATE_FRAME';
            }
            canvas.renderAll();
        }

        document.getElementById('generateRunnersBtn').addEventListener('click', function() {
            if (isFrameGenerated) {
                clearGlobalRunners();
                return;
            }

            clearGlobalRunners(); 
            const parts = canvas.getObjects().filter(obj => obj.isSpruePart);
            if (parts.length === 0) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            parts.forEach(part => {
                const actW = part.width * part.scaleX;
                const actH = part.height * part.scaleY;
                const pLeft = part.left - actW/2; const pTop = part.top - actH/2;
                const pRight = part.left + actW/2; const pBottom = part.top + actH/2;
                
                if(pLeft < minX) minX = pLeft; if(pTop < minY) minY = pTop;
                if(pRight > maxX) maxX = pRight; if(pBottom > maxY) maxY = pBottom;
            });

            const padding = 60; 
            minX = Math.floor((minX - padding) / CONFIG.gridSize) * CONFIG.gridSize;
            minY = Math.floor((minY - padding) / CONFIG.gridSize) * CONFIG.gridSize;
            maxX = Math.ceil((maxX + padding) / CONFIG.gridSize) * CONFIG.gridSize;
            maxY = Math.ceil((maxY + padding) / CONFIG.gridSize) * CONFIG.gridSize;

            const outerFrame = new fabric.Rect({
                left: minX + (maxX - minX)/2, top: minY + (maxY - minY)/2,
                originX: 'center', originY: 'center',
                width: maxX - minX, height: maxY - minY,
                fill: 'transparent', 
                stroke: CONFIG.lineColor, strokeWidth: CONFIG.lineWidth,
                rx: 30, ry: 30, 
                selectable: false, evented: false, strokeUniform: true
            });
            globalRunners.push(outerFrame);
            canvas.add(outerFrame);

            const lineOpts = { stroke: CONFIG.lineColor, strokeWidth: CONFIG.lineWidth, selectable: false, evented: false, strokeUniform: true };

            parts.forEach(part => {
                const cx = part.left; const cy = part.top;
                const hLine = new fabric.Line([minX, cy, maxX, cy], lineOpts);
                const vLine = new fabric.Line([cx, minY, cx, maxY], lineOpts);
                
                globalRunners.push(hLine, vLine);
                canvas.add(hLine, vLine);
                hLine.sendToBack(); vLine.sendToBack(); 
            });

            outerFrame.sendToBack();
            canvas.discardActiveObject();
            canvas.renderAll();
            
            isFrameGenerated = true;
            this.classList.add('bg-white', 'text-black');
            this.classList.remove('text-white');
            this.textContent = 'REMOVE_FRAME';
        });

        const offCtx = document.getElementById('offscreenCanvas').getContext('2d', { willReadFrequently: true });
        let currentUserImage = null;

        const uploadView = document.getElementById('uploadView');
        const settingsView = document.getElementById('settingsView');
        const thresholdSlider = document.getElementById('thresholdSlider');

        function processImageToLineArt(img, threshold) {
            const offCanvas = document.getElementById('offscreenCanvas');
            const maxDim = 600; 
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
                const r = Math.min(maxDim / w, maxDim / h); w *= r; h *= r;
            }
            offCanvas.width = w; offCanvas.height = h;
            
            offCtx.fillStyle = '#ffffff'; offCtx.fillRect(0, 0, w, h);
            offCtx.drawImage(img, 0, 0, w, h);
            
            const imageData = offCtx.getImageData(0, 0, w, h);
            const data = imageData.data;
            const lc = { r: 244, g: 244, b: 244 }; 

            for (let i = 0; i < data.length; i += 4) {
                const luminance = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                if (luminance < threshold) {
                    data[i] = lc.r; data[i+1] = lc.g; data[i+2] = lc.b; data[i+3] = 255;
                } else {
                    data[i+3] = 0; 
                }
            }
            offCtx.putImageData(imageData, 0, 0);
            return offCanvas.toDataURL('image/png');
        }

        document.getElementById('imageUpload').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.onload = () => {
                    currentUserImage = img;
                    uploadView.classList.add('hidden');
                    settingsView.classList.remove('hidden');
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
            e.target.value = ''; 
        });

        thresholdSlider.addEventListener('input', e => {
            document.getElementById('thresholdValDisplay').textContent = e.target.value;
        });

        document.getElementById('cancelImgBtn').addEventListener('click', () => {
            currentUserImage = null;
            settingsView.classList.add('hidden');
            uploadView.classList.remove('hidden');
        });

        document.getElementById('insertImgBtn').addEventListener('click', () => {
            if (!currentUserImage) return;
            const thres = parseInt(thresholdSlider.value);
            const dataUrl = processImageToLineArt(currentUserImage, thres);
            
            fabric.Image.fromURL(dataUrl, imgObj => {
                if (imgObj.width > 175) imgObj.scaleToWidth(175); 
                createSpruePart(imgObj);
                document.getElementById('cancelImgBtn').click();
            });
        });

        function insertTextProp(char, x = null, y = null) {
            const propText = new fabric.Text(char, {
                fontFamily: CONFIG.fontFamily, fontSize: 70, fill: CONFIG.lineColor, strokeUniform: true, fontWeight: 'bold' 
            });
            createSpruePart(propText, x, y);
        }

        document.getElementById('addCustomTextBtn').addEventListener('click', () => {
            const val = document.getElementById('customText').value.trim();
            if(val) { insertTextProp(val); document.getElementById('customText').value = ''; }
        });

        mainContainer.addEventListener('dragover', (e) => {
            e.preventDefault(); 
        });

        mainContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            const textVal = e.dataTransfer.getData('value');
            const svgKey = e.dataTransfer.getData('svg-key');
            
            if (textVal || svgKey) {
                const pointer = canvas.getPointer(e);
                let dropX = pointer.x;
                let dropY = pointer.y;
                
                const snappedX = Math.round(dropX / CONFIG.gridSize) * CONFIG.gridSize;
                const snappedY = Math.round(dropY / CONFIG.gridSize) * CONFIG.gridSize;
                
                if (svgKey) {
                    insertSVGProp(svgKey, snappedX, snappedY);
                } else if (textVal) {
                    insertTextProp(textVal, snappedX, snappedY);
                }
            }
        });

        window.addEventListener('keydown', e => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (e.target.tagName.toLowerCase() === 'input') return; 
                const activeObjects = canvas.getActiveObjects();
                if (activeObjects.length) {
                    canvas.discardActiveObject();
                    activeObjects.forEach(obj => canvas.remove(obj));
                    clearGlobalRunners();
                }
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            canvas.discardActiveObject();
            
            let parts = canvas.getObjects().filter(o => o.isSpruePart || globalRunners.includes(o));
            if(parts.length === 0) { alert('CANVAS IS EMPTY.'); return; }

            const originalVpt = canvas.viewportTransform.slice();
            
            canvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
            canvas.renderAll();

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            parts.forEach(part => {
                const b = part.getBoundingRect();
                if(b.left < minX) minX = b.left; 
                if(b.top < minY) minY = b.top;
                if(b.left + b.width > maxX) maxX = b.left + b.width; 
                if(b.top + b.height > maxY) maxY = b.top + b.height;
            });

            const cropPad = 40; 
            
            const exportOpts = {
                left: minX - cropPad, 
                top: minY - cropPad,
                width: (maxX - minX) + cropPad*2, 
                height: (maxY - minY) + cropPad*2,
                format: 'png', 
                quality: 1, 
                multiplier: 2 
            };

            const dataURL = canvas.toDataURL(exportOpts);

            canvas.setViewportTransform(originalVpt);
            canvas.renderAll();

            const link = document.createElement('a');
            link.download = 'SPRUE_SYS_POSTER.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
